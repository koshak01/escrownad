# Foundry — building the EscrowNad Solidity contracts.
#
# NOTE: `src` points at `contracts/`, not `src/` — the latter holds the Rust
# application. Artefacts land in `contracts/out`, which is gitignored.
#
# Build with `forge build` (Foundry's forge).

[profile.default]
src = "contracts"
out = "contracts/out"
libs = []
cache_path = "contracts/cache"
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = false

[rpc_endpoints]
monad_testnet = "https://testnet-rpc.monad.xyz"
monad = "https://rpc.monad.xyz"
