# escrownad — running every service locally through mprocs.
# Ports: web :4100, ws :4101.
#
# Before the first run:   cargo build
# Run from the repo root:  mprocs
#
# The database is escrownad.com over a tunnel at 127.0.0.1:5432 (see etc/database.toml).
procs:
  database: { shell: "cargo run --bin escrownad-database" }
  notifier: { shell: "cargo run --bin escrownad-notifier" }
  ws:       { shell: "cargo run --bin escrownad-ws" }
  web:      { shell: "cargo run --bin escrownad-web" }
