# escrownad-database
# The IPC daemon. Connects to Postgres and serves ws/web/notifier.
#
# Postgres:
#   - a unix socket is used when available, with no password (peer/trust auth);
#   - otherwise TCP, with the password from PGPASSWORD or ~/.pgpass.
# The IPC socket path is in escrownad::sockets::DATABASE.
#
# db = escrownad.com — the database name matches the domain.

[postgres]
host = "127.0.0.1"
port = 5432
user = "html"
db   = "escrownad.com"
max_connections = 8
