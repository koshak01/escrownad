# escrownad-database
# IPC-демон. Подключается к Postgres, обслуживает запросы от ws/web/notifier.
#
# Postgres:
#   - если доступен unix-сокет — используется он, без пароля (peer/trust auth);
#   - иначе TCP, пароль из PGPASSWORD env или ~/.pgpass.
# Имя сокета IPC — в escrownad::sockets::DATABASE.
#
# db = escrownad.com — домен/имя БД (Гиперион). НЕ forge.foothold.me.

[postgres]
host = "127.0.0.1"
port = 5432
user = "html"
db   = "escrownad.com"
max_connections = 8
