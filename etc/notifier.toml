# escrownad-notifier — the Telegram worker with a rate-limited queue.
# Never touches Postgres — the bot token and templates come over IPC.

[telegram]
# Minimum interval between sends (the Bot API allows ~30 msg/s; we stay below).
send_interval_ms = 3000
# HTTP timeout for api.telegram.org.
api_timeout_ms = 10000
# Capacity of the mpsc queue. On overflow the IPC client gets an Err.
queue_capacity = 1024
# How long to wait for escrownad-database at startup, in milliseconds.
db_wait_ms = 10000
