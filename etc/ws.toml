# escrownad-ws — server-side renderer + WS gateway.
# Never touches Postgres — everything goes over IPC to escrownad-database.

[ws]
# How long to wait for escrownad-database at startup, in milliseconds.
db_wait_ms = 10000

# Environment: local | staging | production.
env = "local"

# The WebSocket URL for the browser: TCP locally, wss behind nginx in
# production. The trailing slash is required.
ws_url = "ws://localhost:4101/ws/"

# WS gateway mode: "tcp" | "unix" — EXACTLY one.
mode        = "tcp"
socket_path = "/tmp/escrownad_ws.sock"
ws_port     = 4101
