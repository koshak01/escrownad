[package]
name = "escrownad"
description = "EscrowNad — proof-escrow / oracle-escrow on Monad (RIPE first); forge UI; escrownad.com"
version = "0.1.0"
edition = "2024"
authors = ["koshak01 <p.elagin@gmail.com>"]
license = "MIT"

# Four binaries talking over unix sockets.
# Start order: database → notifier → ws → web.
[[bin]]
name = "escrownad-database"
path = "src/bin/database.rs"

[[bin]]
name = "escrownad-notifier"
path = "src/bin/notifier.rs"

[[bin]]
name = "escrownad-ws"
path = "src/bin/ws.rs"

[[bin]]
name = "escrownad-web"
path = "src/bin/web.rs"

# Observer: polls RIPE PA+PI, matches deals, mock/real release.
[[bin]]
name = "escrownad-observer"
path = "src/bin/observer.rs"

[dependencies]
# The shared platform, living side by side at ../forge/ (not public).
forge-admin    = { path = "../forge/crates/forge-admin" }
forge-core     = { path = "../forge/crates/forge-core" }
forge-db       = { path = "../forge/crates/forge-db" }
forge-fixed-n  = { path = "../forge/crates/forge-fixed-n" }
forge-ipc      = { path = "../forge/crates/forge-ipc" }
forge-notifier = { path = "../forge/crates/forge-notifier" }
forge-session  = { path = "../forge/crates/forge-session" }
forge-web      = { path = "../forge/crates/forge-web" }
forge-ws       = { path = "../forge/crates/forge-ws" }

# External dependencies — the same versions as the platform workspace.
tokio       = { version = "1", features = ["full"] }
sqlx        = { version = "0.9.0-alpha.1", features = ["runtime-tokio", "postgres", "chrono", "uuid"] }
axum        = { version = "0.8", features = ["ws", "macros"] }
tower-http  = { version = "0.6", features = ["fs", "compression-gzip", "normalize-path", "trace"] }
tera        = { version = "2", features = ["glob_fs"] }
serde       = { version = "1", features = ["derive", "rc"] }
serde_json  = "1"
chrono      = { version = "0.4", features = ["serde"] }
anyhow      = "1"
thiserror   = "2"
tracing     = "0.1"
async-trait = "0.1"
reqwest     = { version = "0.13", default-features = false, features = ["json", "rustls"] }

# Sanitising wysiwyg HTML before it reaches the database (tag whitelist).
# Without it a listing description could not be rendered through `| safe` —
# that would be an XSS hole.
ammonia     = "4"

# EVM client for Monad: signing and sending release/refund to EscrowLock, and
# reading deal state from the contract. Default features cover contract +
# provider-http + rpc-types + signer-local, over rustls as with reqwest.
alloy       = "2"

# EVM wallet login (MetaMask personal_sign → ecrecover)
k256  = { version = "0.13", features = ["ecdsa"] }
sha3  = "0.10"
hex   = "0.4"
rand  = "0.8"
uuid  = { version = "1", features = ["v4"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
