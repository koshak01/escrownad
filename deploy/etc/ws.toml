# escrownad-ws — production.
# Hyperion: ln -sf deploy/etc/ws.toml etc/ws.toml

[ws]
db_wait_ms = 10000
env        = "production"

# Browser WS via nginx on wst.escrownad.com (trailing slash required).
ws_url = "wss://wst.escrownad.com/ws/"

mode        = "unix"
socket_path = "/tmp/escrownad_ws.sock"
ws_port     = 3001
