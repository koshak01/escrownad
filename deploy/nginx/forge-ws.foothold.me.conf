# =============================================================================
# forge-ws.foothold.me — WebSocket Gateway.
# Один location:
#   /ws/{session_id}/  — browser-сессии (msgpack-команды от админки).
#
# Идёт на skeleton-ws (unix:/tmp/forge_ws.sock).
# =============================================================================

upstream forge_ws {
    server unix:/tmp/forge_ws.sock;
    keepalive 32;
    keepalive_requests 10000;
    keepalive_timeout 60s;
}

# =============================================================================
# HTTPS + HTTP/3
# =============================================================================
server {
    listen 5.75.210.111:443 ssl;
    http2 on;

    listen 5.75.210.111:443 quic;
    http3 on;

    server_name forge-ws.foothold.me;

    # ─── SSL/TLS — общий wildcard *.foothold.me от synapse ──────────────────
    ssl_certificate     /work/production/rust/forge/skeleton/deploy/nginx/ssl/cert.pem;
    ssl_certificate_key /work/production/rust/forge/skeleton/deploy/nginx/ssl/private.key;

    ssl_protocols TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    add_header Alt-Svc 'h3=":443"; ma=86400' always;

    add_header X-Frame-Options        "DENY"          always;
    add_header X-Content-Type-Options "nosniff"       always;
    add_header X-XSS-Protection       "1; mode=block" always;

    # CORS для браузерного WS с основного домена.
    add_header Access-Control-Allow-Origin  "https://forge.foothold.me" always;
    add_header Access-Control-Allow-Methods "GET, OPTIONS"               always;
    add_header Access-Control-Allow-Headers "Origin, Content-Type, Accept" always;

    access_log /var/log/nginx/forge-ws.foothold.me_access.log;
    error_log  /var/log/nginx/forge-ws.foothold.me_error.log;

    # ─── /ws/ — браузерные сессии ────────────────────────────────────────────
    location /ws/ {
        proxy_pass http://forge_ws;

        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout    86400s;
        proxy_send_timeout    86400s;
        proxy_connect_timeout 10s;
        proxy_buffering off;
    }

    # ─── Healthcheck ─────────────────────────────────────────────────────────
    location = /health {
        return 200 'OK';
        add_header Content-Type text/plain always;
        access_log off;
    }

    location / {
        return 301 https://forge.foothold.me$request_uri;
    }
}

# =============================================================================
# HTTP → HTTPS редирект
# =============================================================================
server {
    listen 5.75.210.111:80;
    server_name forge-ws.foothold.me;
    return 301 https://forge-ws.foothold.me$request_uri;
}
