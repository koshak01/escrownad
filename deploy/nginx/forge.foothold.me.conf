# =============================================================================
# forge.foothold.me — основной HTTP домен (admin-UI, login, эталонные страницы).
# HTTPS + HTTP/3. Прокси на skeleton-web (unix:/tmp/forge_web.sock).
# =============================================================================

upstream forge_web {
    server unix:/tmp/forge_web.sock;
    keepalive 32;
    keepalive_requests 10000;
    keepalive_timeout 60s;
}

# =============================================================================
# HTTPS + HTTP/3
# =============================================================================
server {
    listen 5.75.210.111:443 ssl;
    http2 on;

    listen 5.75.210.111:443 quic;
    http3 on;

    server_name forge.foothold.me;

    # ─── SSL/TLS ─────────────────────────────────────────────────────────────
    # Используем общий wildcard *.foothold.me, который держит synapse —
    # никаких своих сертификатов для skeleton/forge.foothold.me не заводим.
    # Конвенция коллектива: один cert на весь foothold-домен.
    ssl_certificate     /work/production/rust/forge/skeleton/deploy/nginx/ssl/cert.pem;
    ssl_certificate_key /work/production/rust/forge/skeleton/deploy/nginx/ssl/private.key;

    ssl_protocols TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    add_header Alt-Svc 'h3=":443"; ma=86400' always;

    add_header X-Frame-Options        "DENY"          always;
    add_header X-Content-Type-Options "nosniff"       always;
    add_header X-XSS-Protection       "1; mode=block" always;

    access_log /var/log/nginx/forge.foothold.me_access.log;
    error_log  /var/log/nginx/forge.foothold.me_error.log;

    # ─── Статика (CSS/JS/images: ядерная forge + проектная skeleton) ─────────
    location ~ ^/shared/(.*)$ {
        alias /work/production/rust/forge/static/$1;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location ~ ^/static/(.*)$ {
        alias /work/production/rust/forge/skeleton/static/$1;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ─── Всё остальное — на web. ─────────────────────────────────────────────
    location / {
        proxy_pass http://forge_web;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }
}

# =============================================================================
# HTTP → HTTPS редирект
# =============================================================================
server {
    listen 5.75.210.111:80;
    server_name forge.foothold.me;
    return 301 https://forge.foothold.me$request_uri;
}
