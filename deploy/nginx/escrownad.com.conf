# escrownad.com — the HTTP UI.
# Proxy → escrownad-web unix:/tmp/escrownad_web.sock
# IP/ssl: the listen address and cert paths are filled in on the server (LE / CF).

upstream escrownad_web {
    server unix:/tmp/escrownad_web.sock;
    keepalive 32;
    keepalive_requests 10000;
    keepalive_timeout 60s;
}

server {
    listen 443 ssl;
    http2 on;

    server_name escrownad.com www.escrownad.com;

    # Path to cert (LE or own CA). Placeholder — replace on the server.
    ssl_certificate     /etc/letsencrypt/live/escrownad.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/escrownad.com/privkey.pem;

    ssl_protocols TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header X-Frame-Options        "DENY"          always;
    add_header X-Content-Type-Options "nosniff"       always;
    add_header X-XSS-Protection       "1; mode=block" always;

    access_log /var/log/nginx/escrownad.com_access.log;
    error_log  /var/log/nginx/escrownad.com_error.log;

    location ~ ^/shared/(.*)$ {
        alias /work/production/rust/forge/static/$1;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location ~ ^/static/(.*)$ {
        alias /work/production/rust/escrownad/static/$1;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # /favicon.ico at the root — crawlers such as Google s2 do not take SVG.
    location = /favicon.ico {
        alias /work/production/rust/escrownad/static/images/favicon.ico;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
        proxy_pass http://escrownad_web;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }
}

server {
    listen 80;
    server_name escrownad.com www.escrownad.com;
    return 301 https://escrownad.com$request_uri;
}
