# wst.escrownad.com — the WebSocket gateway.
# /ws/{session_id}/ → escrownad-ws unix:/tmp/escrownad_ws.sock

upstream escrownad_ws {
    server unix:/tmp/escrownad_ws.sock;
    keepalive 32;
    keepalive_requests 10000;
    keepalive_timeout 60s;
}

server {
    listen 443 ssl;
    http2 on;

    server_name wst.escrownad.com;

    ssl_certificate     /etc/letsencrypt/live/escrownad.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/escrownad.com/privkey.pem;

    ssl_protocols TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header X-Frame-Options        "DENY"          always;
    add_header X-Content-Type-Options "nosniff"       always;
    add_header Access-Control-Allow-Origin  "https://escrownad.com" always;
    add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Origin, Content-Type, Accept" always;

    access_log /var/log/nginx/wst.escrownad.com_access.log;
    error_log  /var/log/nginx/wst.escrownad.com_error.log;

    location /ws/ {
        proxy_pass http://escrownad_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout    86400s;
        proxy_send_timeout    86400s;
        proxy_connect_timeout 10s;
        proxy_buffering off;
    }

    # The Telegram webhook: Approve/Decline presses on listing cards arrive
    # here. Authenticity is proven by the header
    # X-Telegram-Bot-Api-Secret-Token. The secret is deliberately absent from
    # the URL: the path is written to access_log in clear text.
    location = /tg/hook {
        proxy_pass http://escrownad_ws;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout    30s;
        proxy_connect_timeout 10s;
    }

    location = /health {
        return 200 'OK';
        add_header Content-Type text/plain always;
        access_log off;
    }

    location / {
        return 301 https://escrownad.com$request_uri;
    }
}

server {
    listen 80;
    server_name wst.escrownad.com;
    return 301 https://wst.escrownad.com$request_uri;
}
