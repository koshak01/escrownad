# escrownad — production supervisor (forge-канон).
#
# 4 bins + Unix IPC:
#   notifier (200)  /tmp/escrownad.notifier.sock
#   database (300)  /tmp/escrownad.database.sock
#   ws (400)        external /tmp/escrownad_ws.sock  + IPC /tmp/escrownad.ws.sock
#   web (500)       external /tmp/escrownad_web.sock
# optional observer (350) — RIPE poll
#
# Socks:
#   /tmp/<app>_<role>.sock  — nginx → bin
#   /tmp/<app>.<role>.sock  — IPC between bins
#
# Install (Hyperion):
#   sudo ln -s /work/production/rust/escrownad/deploy/supervisor/escrownad.conf \
#              /etc/supervisor/conf.d/escrownad.conf
#   sudo supervisorctl reread && sudo supervisorctl update
#   sudo supervisorctl restart escrownad:*

[program:escrownad_notifier]
command         = /work/production/rust/escrownad/target/release/escrownad-notifier
directory       = /work/production/rust/escrownad
stdout_logfile  = /work/production/rust/log/escrownad_notifier.log
redirect_stderr = true
user            = html
group           = www
autostart       = true
autorestart     = true
startsecs       = 2
priority        = 200

[program:escrownad_database]
command         = /work/production/rust/escrownad/target/release/escrownad-database
directory       = /work/production/rust/escrownad
stdout_logfile  = /work/production/rust/log/escrownad_database.log
redirect_stderr = true
user            = html
group           = www
autostart       = true
autorestart     = true
startsecs       = 3
priority        = 300

[program:escrownad_observer]
command         = /work/production/rust/escrownad/target/release/escrownad-observer
directory       = /work/production/rust/escrownad
stdout_logfile  = /work/production/rust/log/escrownad_observer.log
redirect_stderr = true
user            = html
group           = www
autostart       = true
autorestart     = true
startsecs       = 5
priority        = 350
# Наблюдатель — единственный процесс с приватным ключом: он подписывает
# release/refund в EscrowLock. Ключ в репозиторий не кладём; Пётр
# дописывает `OBSERVER_PRIVATE_KEY="0x..."` в эту строку на сервере.
# Без ключа сервис не падает — остаётся в режиме mock и пишет об этом в лог.
environment     = OBSERVER_INTERVAL_SEC="300",
                  CHAIN_MODE="live",
                  MONAD_RPC="https://testnet-rpc.monad.xyz",
                  MONAD_CHAIN_ID="10143",
                  USDC_ADDRESS="0x534b2f3A21130d7a60830c2Df862319e593943A3",
                  ESCROW_LOCK_ADDRESS="0x3CB2C5EA954C7711EfF621A784CD096E4E580be5"

[program:escrownad_ws]
command         = /work/production/rust/escrownad/target/release/escrownad-ws
directory       = /work/production/rust/escrownad
stdout_logfile  = /work/production/rust/log/escrownad_ws.log
redirect_stderr = true
user            = html
group           = www
autostart       = true
autorestart     = true
startsecs       = 2
priority        = 400
# ws отдаёт браузеру параметры оплаты и ПРОВЕРЯЕТ факт оплаты в цепи.
# Приватного ключа здесь нет и быть не должно — чтение подписи не требует.
environment     = CHAIN_MODE="live",
                  MONAD_RPC="https://testnet-rpc.monad.xyz",
                  MONAD_CHAIN_ID="10143",
                  USDC_ADDRESS="0x534b2f3A21130d7a60830c2Df862319e593943A3",
                  ESCROW_LOCK_ADDRESS="0x3CB2C5EA954C7711EfF621A784CD096E4E580be5"

[program:escrownad_web]
command         = /work/production/rust/escrownad/target/release/escrownad-web
directory       = /work/production/rust/escrownad
stdout_logfile  = /work/production/rust/log/escrownad_web.log
redirect_stderr = true
user            = html
group           = www
autostart       = true
autorestart     = true
startsecs       = 2
priority        = 500

[group:escrownad]
programs = escrownad_notifier,escrownad_database,escrownad_observer,escrownad_ws,escrownad_web
priority = 999
