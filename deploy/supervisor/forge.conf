# forge (skeleton эталон) — production конфигурация supervisor.
#
# Архитектура — 4 бинарника + Unix-socket IPC между ними:
#   1. notifier (200) — очередь Telegram-уведомлений.
#                       Сокет: /tmp/forge.notifier.sock
#   2. database (300) — единственный путь к PostgreSQL.
#                       Сокет: /tmp/forge.database.sock
#   3. ws (400)       — WebSocket gateway + Tera renderer.
#                       Слушает unix-сокет /tmp/forge_ws.sock (через nginx).
#                       Маршрут: /ws/{session_id}/ (browser).
#                       Сокет (для render-IPC от web): /tmp/forge.ws.sock
#   4. web (500)      — HTTP-сервер (axum), статика + прокси render → ws.
#                       Слушает unix-сокет /tmp/forge_web.sock (через nginx).
#
# Соглашение об именах сокетов (forge-стандарт):
#   /tmp/<project>_<role>.sock  — внешний listener (nginx → бинарь)
#   /tmp/<project>.<role>.sock  — внутренний IPC между бинарями
#
# Установка (стандарт foothold — `ln -s` прямо из репы):
#   sudo ln -s /work/production/rust/forge/skeleton/deploy/supervisor/forge.conf \
#              /etc/supervisor/conf.d/forge.conf
#   sudo supervisorctl reread
#   sudo supervisorctl update
#
# Управление группой:
#   sudo supervisorctl start   forge:*
#   sudo supervisorctl stop    forge:*
#   sudo supervisorctl restart forge:*
#   sudo supervisorctl status  forge:*
#
# При выпуске новой версии (git pull + cargo build --release):
#   sudo supervisorctl restart forge:*

[program:forge_notifier]
command         = /work/production/rust/forge/target/release/skeleton-notifier
directory       = /work/production/rust/forge/skeleton
stdout_logfile  = /work/production/rust/log/forge_notifier.log
redirect_stderr = true
user            = html
group           = www
autostart       = true
autorestart     = true
startsecs       = 2
priority        = 200

[program:forge_database]
command         = /work/production/rust/forge/target/release/skeleton-database
directory       = /work/production/rust/forge/skeleton
stdout_logfile  = /work/production/rust/log/forge_database.log
redirect_stderr = true
user            = html
group           = www
autostart       = true
autorestart     = true
startsecs       = 3
priority        = 300

[program:forge_ws]
command         = /work/production/rust/forge/target/release/skeleton-ws
directory       = /work/production/rust/forge/skeleton
stdout_logfile  = /work/production/rust/log/forge_ws.log
redirect_stderr = true
user            = html
group           = www
autostart       = true
autorestart     = true
startsecs       = 2
priority        = 400

[program:forge_web]
command         = /work/production/rust/forge/target/release/skeleton-web
directory       = /work/production/rust/forge/skeleton
stdout_logfile  = /work/production/rust/log/forge_web.log
redirect_stderr = true
user            = html
group           = www
autostart       = true
autorestart     = true
startsecs       = 2
priority        = 500

# Группа для управления всеми сервисами одной командой.
[group:forge]
programs = forge_notifier,forge_database,forge_ws,forge_web
priority = 999
